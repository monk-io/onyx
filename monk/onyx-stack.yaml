    minio:
      target: onyx/minio
      service: api
      description: Private MinIO S3 connection used by background workers.
    inference-model:
      target: onyx/inference-model
      service: model
      description: Private inference model server connection used by background workers.
    indexing-model:
      target: onyx/indexing-model
      service: model
      description: Private indexing model server connection used by background workers.
    api:
      target: onyx/api
      service: api
      description: Private API connection used by worker integrations.
  depends:
    wait-for:
      runnables:
        - onyx/api
        - onyx/postgres
        - onyx/redis
        - onyx/opensearch
        - onyx/minio
        - onyx/inference-model
        - onyx/indexing-model
      timeout: 1200

stack:
  defines: process-group
  metadata:
    name: Onyx Standalone Stack
    description: |
      Secure production-intended Onyx Standard stack with private PostgreSQL, Redis, OpenSearch, MinIO, local model servers, API, background workers, and a web UI exposed through Monk ingress. No dependency service is published publicly. Inheriting production templates that need stable credentials must replace generated sensitive values with secret(...) using plain secret names.
    tags: onyx, ai-chat, rag, enterprise-search, standalone, production
    website: https://onyx.app/
    source: https://github.com/onyx-dot-app/onyx
    publisher: monk.io
    private: false
  runnable-list:
    - onyx/postgres
