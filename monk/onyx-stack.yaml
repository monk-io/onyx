    indexing-model-server-host:
      type: string
      env: INDEXING_MODEL_SERVER_HOST
      value: <- connection-hostname("indexing-model")
      description: Indexing model server hostname read from the Monk connection.
    minio-host:
      type: string
      value: <- connection-hostname("minio")
