  defines: runnable
  inherits: onyx/background-base
  metadata:
    name: Onyx Standalone Background Workers
    description: |
      Production-intended Onyx background worker runnable for the Standard standalone stack. It connects to the same private dependencies as the API and remains unexposed.
    tags: onyx, celery, workers, rag, enterprise-search, production
